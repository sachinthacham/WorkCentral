name: Regenerate client lockfile (Linux)

# One-off helper. npm's hoisting depends on the machine that resolves the tree,
# so a lockfile generated on Windows can be rejected by `npm ci` on Linux.
# This resolves it on the same OS/npm the pipeline uses and uploads the result.
on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - run: npm install -g npm@10.9.3
      - name: Resolve dependency tree from scratch
        working-directory: client
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund
      - name: Verify npm ci accepts it
        working-directory: client
        run: |
          rm -rf node_modules
          npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: client-package-lock
          path: client/package-lock.json
